<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Arial',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow-x:hidden;
    color:white;
    text-align:center;
    transition:1s;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.glass{
    background:rgba(255,255,255,0.15);
    padding:40px;
    border-radius:30px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    max-width:900px;
    width:90%;
}

h1{
    font-size:4rem;
    margin-bottom:20px;
}

p{
    font-size:1.3rem;
    line-height:1.8;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    margin:15px;
    font-size:1.2rem;
    cursor:pointer;
    transition:0.3s;
}

#yesBtn{
    background:white;
    color:#ff4f81;
}

#noBtn{
    background:#ff4f81;
    color:white;
    position:relative;
}

button:hover{
    transform:scale(1.08);
}

#mainContent{
    display:none;
}

.heart{
    position:fixed;
    font-size:25px;
    animation:float 6s linear infinite;
    z-index:999;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:40px;
}

.gallery img{
    width:100%;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
    transition:0.5s;
}

.gallery img:hover{
    transform:scale(1.05);
}

#typewriter{
    min-height:220px;
}

.counter{
    margin-top:30px;
    font-size:1.5rem;
}

.special{
    margin-top:40px;
    font-size:2rem;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

#loveMeter{
    font-size:2rem;
    margin-top:20px;
}

#surprise{
    display:none;
    margin-top:40px;
}

#funnyPhoto{
    display:none;
    margin-top:30px;
}

#funnyPhoto img{
    width:300px;
    border-radius:20px;
}

</style>
</head>

<body>

<audio id="music" loop>
<source src="jo-ishq-hua.mp3" type="audio/mp3">
</audio>

<div class="container">

<div class="glass">

<div id="question">

<h1>Hey Love ❤️</h1>

<p>Do you want to open my heart?</p>

<button id="yesBtn">YES ❤️</button>
<button id="noBtn">NO 😒</button>

<div id="loveMeter"></div>

</div>

<div id="mainContent">

<h1>I KNEW YOU’D SAY YES ❤️</h1>

<div id="typewriter"></div>

<div class="counter" id="counter"></div>

<div class="gallery">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">

</div>

<button id="surpriseBtn">
Click for one more surprise 🎁
</button>

<div id="surprise">

<h1>You Are My Safest Place ❤️</h1>

<p>
Thank you for existing.
Thank you for loving me.
Thank you for always being there for me.
</p>

<div class="special">
Forever yours ❤️
</div>

<button id="funnyBtn">
click if you think you're cute 😒
</button>

<div id="funnyPhoto">
<img src="photo7.jpg">
</div>

</div>

</div>

</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

const noMessages = [
"Are you sure? 🥺",
"Don't you love me? 😭",
"My feelings are hurt 💔",
"Please open ittt ❤️",
"Why are you running 😭"
];

let noCount = 0;

noBtn.addEventListener("mouseover", () => {

noBtn.innerText = noMessages[noCount % noMessages.length];

const x = Math.random()*300-150;
const y = Math.random()*300-150;

noBtn.style.transform =
`translate(${x}px,${y}px) scale(${1+noCount*0.1})`;

noCount++;

});

yesBtn.addEventListener("mouseover", () => {

yesBtn.innerText = "hehe I knew it ❤️";

yesBtn.style.boxShadow =
"0 0 30px rgba(255,255,255,0.9)";

});

yesBtn.addEventListener("click", () => {

document.getElementById("music").play();

document.getElementById("loveMeter").innerHTML =
"Analyzing love... ❤️";

let percent = 0;

const interval = setInterval(() => {

percent += 10;

document.getElementById("loveMeter").innerHTML =
percent + "% IN LOVE ❤️";

if(percent >= 100){

clearInterval(interval);

setTimeout(() => {

document.getElementById("question").style.display =
"none";

document.getElementById("mainContent").style.display =
"block";

typeWriter();

createHearts();

},1000);

}

},200);

});

const text = `
I just wanted to remind you how important you are to me.

Thank you for always being there for me,
for loving me,
supporting me,
and making life feel safer and happier.

I’m genuinely so grateful that you exist.

No matter what happens,
having you beside me means everything ❤️
`;

let i = 0;

function typeWriter(){

if(i < text.length){

document.getElementById("typewriter").innerHTML +=
text.charAt(i);

i++;

setTimeout(typeWriter,40);

}

}

function createHearts(){

setInterval(() => {

const heart = document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";

heart.style.fontSize =
Math.random()*20 + 20 + "px";

document.body.appendChild(heart);

setTimeout(() => {
heart.remove();
},6000);

},300);

}

const startDate = new Date("2026-03-19");

function updateCounter(){

const now = new Date();

const diff = now - startDate;

const days = Math.floor(diff/(1000*60*60*24));

const hours = Math.floor(
(diff/(1000*60*60))%24
);

const mins = Math.floor(
(diff/(1000*60))%60
);

document.getElementById("counter").innerHTML =
`❤️ Together since 19 March 2026<br>
${days} days ${hours} hours ${mins} minutes`;

}

setInterval(updateCounter,1000);

document.getElementById("surpriseBtn")
.addEventListener("click",() => {

document.getElementById("surprise")
.style.display = "block";

for(let i=0;i<50;i++){

const heart = document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "💖";

heart.style.left = Math.random()*100 + "vw";

document.body.appendChild(heart);

setTimeout(() => {
heart.remove();
},6000);

}

});

document.getElementById("funnyBtn")
.addEventListener("click",() => {

document.getElementById("funnyPhoto")
.style.display = "block";

});

</script>

</body>
</html>
